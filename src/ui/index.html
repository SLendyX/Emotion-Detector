<!DOCTYPE html>
<html>
<head>
    <title>Emotion AI Recorder</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #1a1a1a; color: #fff; }
        
        /* Container pentru Video + Canvas suprapus */
        .video-container { 
            position: relative; 
            width: 640px; 
            height: 480px; 
            margin: 20px auto; 
            border: 3px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        #videoElement, #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #overlayCanvas { z-index: 10; } /* Canvas peste Video */

        /* Controale */
        .controls { margin: 20px; }
        button {
            padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px;
            margin: 0 10px; transition: 0.3s;
        }
        .btn-start { background-color: #28a745; color: white; }
        .btn-stop { background-color: #dc3545; color: white; display: none; }
        .btn-start:hover { background-color: #218838; }

        /* Rezultate */
        .dashboard { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .stats-box { text-align: left; width: 300px; background: #333; padding: 15px; border-radius: 8px; }
        .bar-container { margin-bottom: 8px; }
        .bar-bg { background: #555; height: 10px; border-radius: 5px; width: 100%; }
        .bar-fill { height: 100%; background: #007bff; border-radius: 5px; transition: width 0.2s; }
        
        /* Grafic */
        #graph-container { margin-top: 30px; display: none; }
        #resultGraph { max-width: 80%; border: 2px solid #555; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Detector Emoții & Înregistrare</h1>

    <div class="video-container">
        <video id="videoElement" autoplay muted></video>
        <canvas id="overlayCanvas" width="640" height="480"></canvas>
    </div>

    <div class="controls">
        <button onclick="startRecording()" class="btn-start" id="startBtn">⏺ Începe Înregistrarea</button>
        <button onclick="stopRecording()" class="btn-stop" id="stopBtn">⏹ Oprește & Generează Raport</button>
    </div>

    <div class="dashboard">
        <div class="stats-box" id="statsOutput">
            Așteptare date...
        </div>
    </div>

    <div id="graph-container">
        <h3>Raport Sesiune:</h3>
        <img id="resultGraph" alt="Grafic Emoții" />
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        const statsDiv = document.getElementById('statsOutput');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const graphContainer = document.getElementById('graph-container');
        const graphImg = document.getElementById('resultGraph');

        const ws = new WebSocket("ws://" + location.host + "/ws");

        // Acces Camera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => console.error(err));

        // Gestionare WebSocket
        ws.onmessage = function(event) {
            const response = JSON.parse(event.data);

            // Cazul 1: Primim imaginea graficului (la final de înregistrare)
            if (response.type === "graph") {
                graphImg.src = "data:image/png;base64," + response.image;
                graphContainer.style.display = "block";
                return;
            }

            // Cazul 2: Primim date live (emoții + coordonate față)
            if (response.type === "data") {
                // 1. Curățăm canvas-ul
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 2. Desenăm pătratul pe față (dacă există)
                if (response.face_coords && response.face_coords.length > 0) {
                    const [x, y, w, h] = response.face_coords;
                    ctx.strokeStyle = "#00FF00"; // Verde Matrix
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, w, h);
                    
                    // Adăugăm și text deasupra cutiei
                    if(response.top_emotii.length > 0){
                        ctx.fillStyle = "#00FF00";
                        ctx.font = "20px Arial";
                        ctx.fillText(response.top_emotii[0].emotie, x, y - 10);
                    }
                }

                // 3. Actualizăm lista de procente
                let html = "";
                response.top_emotii.forEach(item => {
                    html += `
                    <div class="bar-container">
                        <div style="display:flex; justify-content:space-between;">
                            <span>${item.emotie}</span>
                            <span>${item.procent}%</span>
                        </div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width:${item.procent}%"></div>
                        </div>
                    </div>`;
                });
                statsDiv.innerHTML = html || "Nu detectez o față...";
            }
        };

        // Trimitere Cadre către Server (10 FPS)
        // Folosim un canvas invizibil pentru a extrage imaginea
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 640;
        tempCanvas.height = 480;
        const tempCtx = tempCanvas.getContext('2d');

        setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
                tempCtx.drawImage(video, 0, 0, 640, 480);
                tempCanvas.toBlob(blob => {
                    ws.send(blob);
                }, 'image/jpeg', 0.7);
            }
        }, 100);

        // Funcții Butoane
        function startRecording() {
            ws.send(JSON.stringify({text: "start_rec"}));
            startBtn.style.display = "none";
            stopBtn.style.display = "inline-block";
            graphContainer.style.display = "none";
        }

        function stopRecording() {
            ws.send(JSON.stringify({text: "stop_rec"}));
            startBtn.style.display = "inline-block";
            stopBtn.style.display = "none";
        }
    </script>
</body>
</html>
